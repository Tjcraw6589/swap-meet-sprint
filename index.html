<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d3a" />
    <meta name="description" content="Buy, haggle or pass. A 60 second morning at the swap meet." />
    <title>Swap Meet Sprint</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b1d3a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        position: fixed;
        inset: 0;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      canvas#game {
        display: block;
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        outline: none;
      }
      #safe {
        position: absolute;
        pointer-events: none;
        visibility: hidden;
        top: var(--safe-top);
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        left: var(--safe-left);
      }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <canvas id="game" tabindex="0" aria-label="Swap Meet Sprint"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
